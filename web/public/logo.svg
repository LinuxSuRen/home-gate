<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="home-gate logo">
  <defs>
    <linearGradient id="hg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4E9DFF"/>
      <stop offset="1" stop-color="#2F6BE6"/>
    </linearGradient>
  </defs>
  <!-- rounded badge -->
  <rect width="128" height="128" rx="30" fill="url(#hg-bg)"/>
