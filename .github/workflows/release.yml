name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build binaries
        run: |
          mkdir -p dist
          for os_arch in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64"; do
            set -- $os_arch
            CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath -ldflags="-s -w -X github.com/linuxsuren/home-gate/internal/version.Version=${GITHUB_REF_NAME}" -o "dist/home-gate-$1-$2" .
          done
      # 每个产物生成 .sha256 校验文件（sha256sum 标准格式），供内置自更新强制校验
      - name: Generate checksums
        run: |
          cd dist
          for f in home-gate-*; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -l
      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
