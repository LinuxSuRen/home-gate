name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: '0 4 * * 6'

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: go, javascript
      - uses: github/codeql-action/analyze@v4
